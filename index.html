<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <title>webDumbis · Stundenpläne</title>
  <script>
    // Anzeige-Modus vor dem ersten Malen setzen (kein Aufblitzen).
    try {
      if (localStorage.getItem("theme") === "dark") document.documentElement.setAttribute("data-theme", "dark");
      if (localStorage.getItem("pinky") === "1") document.documentElement.setAttribute("data-pinky", "");
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <a class="brand" href="#/" aria-label="webDumbis Startseite">
        <span class="wm-web">web</span><span class="wm-main">Dumbis</span>
      </a>
      <div class="cohort-switch" id="cohortSwitch" role="group" aria-label="Stufe wählen"></div>
      <nav id="nav" aria-label="Hauptnavigation"></nav>
      <div class="side-foot" id="sideFoot"></div>
    </aside>

    <div class="content">
      <main id="view"></main>
      <footer class="page-foot" id="pageFoot"></footer>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
